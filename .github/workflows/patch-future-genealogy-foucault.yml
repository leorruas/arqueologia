name: Aplicar Foucault à Genealogia de Futuros

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-future-genealogy-foucault.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Aplicar atualização
        run: node scripts/patch-future-genealogy-foucault.mjs

      - name: Salvar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "01 conceitos/Genealogia de Futuros.md" log.md
          git commit -m "docs: relaciona Genealogia de Futuros à genealogia foucaultiana"
          git push
