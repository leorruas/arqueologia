name: Validar e publicar o acervo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar JavaScript e contratos
        run: |
          for script in *.js scripts/*.mjs; do node --check "$script"; done
          node --test tests/contracts.test.mjs
      - name: Gerar índice e relatórios sem modificar notas
        run: |
          node scripts/build-search-index.mjs
          node scripts/audit-editorial.mjs
          node scripts/audit-network.mjs
      - name: Preparar propostas de conteúdo para revisão
        run: |
          node scripts/normalize-sentence-case.mjs
          node scripts/migrate-artifact-sheets.mjs
          node scripts/consolidate-unresolved-links.mjs
      - name: Aplicar bloqueios de publicação
        run: node scripts/validate-publication.mjs
      - name: Disponibilizar relatórios e propostas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-e-propostas
          include-hidden-files: true
          path: |
            *-report.json
            .review/
      - name: Montar pacote público filtrado
        run: node scripts/build-public-site.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: .site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar somente após validação
        id: deployment
        uses: actions/deploy-pages@v4
