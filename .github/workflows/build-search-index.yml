name: Atualizar índice e auditorias

on:
  push:
    branches:
      - main
    paths:
      - "00 tipos de design/**/*.md"
      - "00 índices/**/*.md"
      - "01 conceitos/**/*.md"
      - "02 variaveis/**/*.md"
      - "03 artefatos/**/*.md"
      - "04 genealogias/**/*.md"
      - "05 percursos/**/*.md"
      - "autores/**/*.md"
      - "empresas/**/*.md"
      - "templates/**/*.md"
      - "AGENTS.md"
      - "me.md"
      - "Instrucoes de Arqueologia.md"
      - "Guia de escrita.md"
      - "index.md"
      - "script.js"
      - "enhancements.js"
      - "enhancements.css"
      - "puc-parity.js"
      - "puc-parity.css"
      - "index.html"
      - "scripts/build-search-index.mjs"
      - "scripts/normalize-sentence-case.mjs"
      - "scripts/migrate-artifact-sheets.mjs"
      - "scripts/audit-editorial.mjs"
      - "scripts/audit-network.mjs"
      - "scripts/record-audit-log.mjs"
      - "scripts/consolidate-unresolved-links.mjs"
      - ".github/workflows/build-search-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validar JavaScript
        run: |
          node --check script.js
          node --check enhancements.js
          node --check puc-parity.js
          node --check scripts/build-search-index.mjs
          node --check scripts/normalize-sentence-case.mjs
          node --check scripts/migrate-artifact-sheets.mjs
          node --check scripts/audit-editorial.mjs
          node --check scripts/audit-network.mjs
          node --check scripts/record-audit-log.mjs
          node --check scripts/consolidate-unresolved-links.mjs

      - name: Normalizar headings estruturais em sentence case
        run: node scripts/normalize-sentence-case.mjs

      - name: Mapear wikilinks sem destino
        run: node scripts/build-search-index.mjs

      - name: Consolidar referências futuras como pistas
        run: node scripts/consolidate-unresolved-links.mjs

      - name: Migrar e enriquecer fichas arqueológicas
        run: node scripts/migrate-artifact-sheets.mjs

      - name: Auditar sentence case e fichas arqueológicas
        run: node scripts/audit-editorial.mjs

      - name: Auditar integração e reciprocidade da rede
        run: node scripts/audit-network.mjs

      - name: Registrar auditoria consolidada no log
        run: node scripts/record-audit-log.mjs

      - name: Gerar índice e relatório final de links
        run: node scripts/build-search-index.mjs

      - name: Salvar normalização, índice e auditorias
        shell: bash
        run: |
          git add \
            "00 tipos de design" \
            "00 índices" \
            "01 conceitos" \
            "02 variaveis" \
            "03 artefatos" \
            "04 genealogias" \
            "05 percursos" \
            autores empresas \
            log.md \
            search-index.json link-report.json editorial-report.json network-report.json
          if [ -f "Pistas de pesquisa.md" ]; then
            git add "Pistas de pesquisa.md"
          fi
          if git diff --cached --quiet; then
            echo "Conteúdo e relatórios já estão atualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: normaliza acervo e atualiza auditorias [skip ci]"
          git push
