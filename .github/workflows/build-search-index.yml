name: Atualizar índice de busca

on:
  push:
    branches:
      - main
    paths:
      - "00 tipos de design/**/*.md"
      - "00 índices/**/*.md"
      - "01 conceitos/**/*.md"
      - "02 variaveis/**/*.md"
      - "03 artefatos/**/*.md"
      - "04 genealogias/**/*.md"
      - "05 percursos/**/*.md"
      - "autores/**/*.md"
      - "empresas/**/*.md"
      - "script.js"
      - "enhancements.js"
      - "enhancements.css"
      - "puc-parity.js"
      - "puc-parity.css"
      - "index.html"
      - "scripts/build-search-index.mjs"
      - ".github/workflows/build-search-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validar JavaScript
        run: |
          node --check script.js
          node --check enhancements.js
          node --check puc-parity.js
          node --check scripts/build-search-index.mjs

      - name: Gerar índice e relatório de links
        run: node scripts/build-search-index.mjs

      - name: Salvar arquivos gerados
        shell: bash
        run: |
          git add search-index.json link-report.json
          if git diff --cached --quiet; then
            echo "Índice e relatório já estão atualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: atualiza índice e relatório de links [skip ci]"
          git push
