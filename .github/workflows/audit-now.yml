name: Auditoria final temporária

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-now.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Rodar auditorias
        run: |
          node scripts/build-search-index.mjs
          node scripts/audit-editorial.mjs
          node scripts/audit-network.mjs
          node scripts/build-search-index.mjs

      - name: Salvar relatórios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search-index.json link-report.json editorial-report.json network-report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: atualiza auditorias após referência foucaultiana [skip ci]"
          git push
